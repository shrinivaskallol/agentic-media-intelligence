# CI: Run tests on push and PR. Excludes integration tests (require Docker + API keys).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentic-media-intelligence

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Lint with Ruff (PEP 8)
        run: uv run ruff check app/ prompts/ tests/ scripts/

      - name: Format check (PEP 8)
        run: uv run ruff format --check app/ prompts/ tests/ scripts/

      - name: Run tests
        run: uv run pytest tests/test_ragas_routing.py tests/test_ragas_evaluator.py -v
