# CI: lint + unit tests on push/PR. Integration tests are skipped (Docker + API keys).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Ruff check
        run: uv run ruff check app/ prompts/ tests/ scripts/

      - name: Ruff format (check only)
        run: uv run ruff format --check app/ prompts/ tests/ scripts/

      - name: Pytest (excluding integration)
        run: uv run pytest tests/ -v -m "not integration"
