# Credentials from .env — copy .env.example to .env and set values
# NEVER commit .env (in .gitignore)

services:
  # Pillar I: Relational Data + Vector Store (Postgres 17)
  postgres:
    image: pgvector/pgvector:pg17
    container_name: agent_sql
    ports:
      - "5433:5432" # Host 5433 → container 5432
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-market_intel}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-market_intel}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2gb # Reserved for vector indexing (HNSW/IVFFlat)
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Pillar II: Graph Data (Neo4j 5.12)
  neo4j:
    image: neo4j:5.12
    container_name: agent_graph
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      # Corrected Neo4j 5.x Memory Settings
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=1G
      # Disables strict validation to allow older config styles if necessary
      - NEO4J_server_config_strict__validation_enabled=false
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  # Pillar III: Caching & State Management (Redis)
  redis:
    image: redis:7-alpine
    container_name: agent_cache
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          memory: 512mb

volumes:
  neo4j_data:
  neo4j_logs:
  postgres_data: